name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 与 gradle/gradle-daemon-jvm.properties 里的 toolchainVersion 保持一致
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 改了 @Entity 却忘了提交 Room 导出的结构文件时，让 CI 失败提醒
      - name: Room schema committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            echo "::error::Room schema changed. Build locally and commit app/schemas/."
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jiaxiaoman-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
