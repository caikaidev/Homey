name: Release

# 推送 v 开头的 tag（如 v1.2）时，用与本地相同的签名打 release 包并发布到 GitHub Releases
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # tag 必须和 versionName 一致，避免发出版本号对不上的包
      - name: Check tag matches versionName
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME}"
            exit 1
          fi

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease bundleRelease --stacktrace

      # 没签上名时 AGP 会输出 app-release-unsigned.apk，这里直接失败
      - name: Collect signed outputs
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "::error::Signed APK not found (signing not configured?)"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/jiaxiaoman-${GITHUB_REF_NAME}.apk"
          cp "$AAB" "dist/jiaxiaoman-${GITHUB_REF_NAME}.aab"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/jiaxiaoman-${GITHUB_REF_NAME}.apk" | head -5 || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
