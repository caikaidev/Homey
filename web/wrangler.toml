# 崽崽小看板 · Cloudflare Worker
# 部署：Workers Builds 连接 GitHub，Root directory = web/，push main 自动部署。
# 如果合并后网站没更新，先看 Worker → 设置 → 构建 里 GitHub 是否还连着。
# 密钥（不进仓库）：在 Dashboard → Workers → Settings → Variables and Secrets 里设置
#   FAMILY_KEY      App 调用 /api/* 的家庭口令
#   GEMINI_API_KEY  P2 起使用
name = "zaizai-board"
main = "src/index.ts"
compatibility_date = "2026-09-30"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zaizai-board"
# 代码只通过 binding "DB" 访问。不要复用其他项目用过的库：迁移记录同名时本项目的建表会被跳过。
database_id = "87c6f2e3-35c8-4f2f-9edd-95cba872ca87"
migrations_dir = "migrations"

[vars]
# Cloudflare Access：团队域名（如 https://<team>.cloudflareaccess.com）与应用 AUD。
# 留空则不接受 Access 登录，只能用 FAMILY_KEY。
ACCESS_TEAM_DOMAIN = "https://caikai.cloudflareaccess.com"
ACCESS_AUD = "0ef6bb4d789952a201aeb4f79d852f38cb5f5accda7648b8ff4a758adb553214"
GEMINI_MODEL = "gemini-3.8-flash"
